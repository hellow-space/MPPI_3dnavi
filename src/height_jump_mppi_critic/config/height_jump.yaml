# Merge this block into your actual controller ID. Preserve the existing critics list
# and append HeightJumpCritic to it. This is not a complete navigation configuration.
controller_server:
  ros__parameters:
    FollowPath:
      HeightJumpCritic:
        enabled: true
        map_topic: "/elevation_mapping_node/elevation_map"  # Verified raw GridMap topic on this Jetson.
        elevation_layer: elevation  # Raw observed elevation, not inpaint/smooth.
        jump_radius: 0.10
        max_height_jump: 0.0  # Required: set the robot's validated threshold in metres.
        map_timeout: 1.0  # Seconds; tune for actual map/observation rate.
        unknown_is_traversable: false  # Temporary opt-in only; outside/stale maps still reject.
        startup_unknown_enabled: false  # Enable only for a confirmed safe startup area.
        fixed_frame: ""  # Required when enabling startup exemption, e.g. actual odom frame.
        unknown_ignore_radius: 0.0  # Required (> 0) when enabling startup exemption; calibrate first.
